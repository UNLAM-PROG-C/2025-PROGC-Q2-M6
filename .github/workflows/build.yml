name: Build Native Image

on:
  pull_request:
    branches:
      - 'release/*'

jobs:
  server-build:
    runs-on: windows-latest  # required to generate real .exe files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (GraalVM)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native executable
        working-directory: TP-Integrador/server
        run: ./gradlew nativeBuild

      - name: Upload all generated .exe files
        uses: actions/upload-artifact@v4
        with:
          name: native-executables
          path: TP-Integrador/server/build/native/nativeCompile/*.exe

  client-build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.1
    env:
      PROJECT_PATH: TP-Integrador/client
      GODOT_VERSION: 4.5.1
      EXPORT_NAME: Chess-M6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Windows Build
        run: |
          mkdir -v -p build/windows
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "Windows Desktop" "$EXPORT_DIR/windows/$EXPORT_NAME.exe"
      - name: Web Build
        run: |
          mkdir -v -p build/web
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "Web" "$EXPORT_DIR/web/index.html"
      - name: Zip Web Build
        run: |
          cd build/web
          zip -r ../web.zip .
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web.zip
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows