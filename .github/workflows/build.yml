name: Build Native Image

on:
  pull_request:
    branches:
      - 'release/*'

permissions:
  contents: write

jobs:
  server-build:
    runs-on: windows-latest  # required to generate real .exe files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (GraalVM)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native executable
        working-directory: TP-Integrador/server
        run: ./gradlew --no-daemon nativeBuild

      - name: Upload all generated .exe files
        uses: actions/upload-artifact@v4
        with:
          name: native-executables
          path: TP-Integrador/server/build/native/nativeCompile/*.exe

  client-build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.1
    env:
      PROJECT_PATH: TP-Integrador/client
      GODOT_VERSION: 4.5.1
      EXPORT_NAME: Chess-M6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Windows Build
        run: |
          mkdir -v -p build/windows
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "Windows Desktop" "$EXPORT_DIR/windows/$EXPORT_NAME.exe"
      - name: Web Build
        run: |
          mkdir -v -p build/web
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "Web" "$EXPORT_DIR/web/index.html"
      - name: Zip Web Build
        run: |
          cd build/web
          zip -r ../web.zip .
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web.zip
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows

  publish-release:
    runs-on: ubuntu-latest
    needs: [server-build, client-build]

    steps:
      - name: Extract release version from branch name
        id: version
        run: |
          BRANCH="${GITHUB_HEAD_REF#release/}"
          echo "tag=v$BRANCH" >> $GITHUB_OUTPUT

      - name: Download server artifact
        uses: actions/download-artifact@v4
        with:
          name: native-executables
          path: ./release/server

      - name: Download Windows client artifact
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: ./release/client/windows

      - name: Download Web client artifact (zip)
        uses: actions/download-artifact@v4
        with:
          name: web
          path: ./release/client/web

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            release/server/**
            release/client/windows/**
            release/client/web/web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
